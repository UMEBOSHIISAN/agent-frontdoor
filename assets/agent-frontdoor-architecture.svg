<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Agent Frontdoor independent primitives and authority boundaries</title>
  <desc id="architecture-desc">Three independent primitives live in the read-only core: Validation, Drift Detection, and Intent Lock. The optional adapter connects only to Intent Lock. Human Gate and Safe Handoff remain under external human or host authority.</desc>
  <defs>
    <linearGradient id="architecture-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="architecture-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#334155" stroke-opacity=".15"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#architecture-bg)"/>
  <rect width="1280" height="720" fill="url(#architecture-grid)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="52" y="58" fill="#f8fafc" font-size="30" font-weight="760">Independent checks. External authority.</text>
    <text x="52" y="90" fill="#94a3b8" font-size="16">No core result is routed into another primitive, and identity never grants permission.</text>

    <rect x="44" y="122" width="824" height="554" rx="26" fill="#111827" fill-opacity=".84" stroke="#6366f1" stroke-width="3"/>
    <rect x="60" y="138" width="792" height="522" rx="18" fill="none" stroke="#3730a3" stroke-opacity=".46"/>
    <text x="82" y="174" fill="#c7d2fe" font-size="17" font-weight="750" letter-spacing="1">Read-only core</text>
    <text x="82" y="202" fill="#94a3b8" font-size="14">Three independent primitives · deterministic local results · no persistent writes</text>

    <g id="validation-primitive">
      <rect x="82" y="226" width="748" height="112" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <text x="106" y="254" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing=".8">INPUT</text>
      <text x="106" y="286" fill="#f8fafc" font-size="17" font-weight="650">Task Card</text>
      <line x1="298" y1="246" x2="298" y2="318" stroke="#4338ca"/>
      <text x="330" y="274" fill="#f8fafc" font-size="22" font-weight="730">Validation</text>
      <text x="330" y="301" fill="#94a3b8" font-size="13">schema + semantics</text>
      <line x1="604" y1="246" x2="604" y2="318" stroke="#4338ca"/>
      <text x="636" y="254" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing=".8">RESULT</text>
      <text x="636" y="286" fill="#e0e7ff" font-size="17" font-weight="700">VALID / INVALID</text>
    </g>

    <g id="drift-detection-primitive">
      <rect x="82" y="354" width="748" height="112" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <text x="106" y="382" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing=".8">INPUT</text>
      <text x="106" y="410" fill="#f8fafc" font-size="16" font-weight="650">Baseline + revised</text>
      <text x="106" y="433" fill="#94a3b8" font-size="13">validated cards</text>
      <line x1="298" y1="374" x2="298" y2="446" stroke="#4338ca"/>
      <text x="330" y="402" fill="#f8fafc" font-size="21" font-weight="730">Drift Detection</text>
      <text x="330" y="429" fill="#94a3b8" font-size="13">named expansion checks</text>
      <line x1="604" y1="374" x2="604" y2="446" stroke="#4338ca"/>
      <text x="636" y="382" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing=".8">RESULT</text>
      <text x="636" y="414" fill="#e0e7ff" font-size="17" font-weight="700">CLEAR / DRIFT</text>
    </g>

    <g id="intent-lock-primitive">
      <rect x="82" y="482" width="748" height="144" rx="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="106" y="510" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing=".8">INPUT</text>
      <text x="106" y="538" fill="#f8fafc" font-size="16" font-weight="650">Prompt + proposed</text>
      <text x="106" y="561" fill="#94a3b8" font-size="13">action</text>
      <line x1="298" y1="502" x2="298" y2="606" stroke="#4338ca"/>
      <text x="330" y="542" fill="#f8fafc" font-size="22" font-weight="730">Intent Lock</text>
      <text x="330" y="569" fill="#94a3b8" font-size="13">literal task identity</text>
      <line x1="604" y1="502" x2="604" y2="606" stroke="#4338ca"/>
      <text x="636" y="510" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing=".8">RESULT</text>
      <text x="636" y="542" fill="#e0e7ff" font-size="16" font-weight="700">ALLOW / DENY / HOLD</text>
      <text x="636" y="570" fill="#94a3b8" font-size="12">identity decision only</text>
    </g>

    <text x="908" y="154" fill="#86efac" font-size="15" font-weight="750">Human authority remains external</text>
    <rect x="900" y="122" width="336" height="296" rx="26" fill="#052e2b" fill-opacity=".46" stroke="#22c55e" stroke-width="3"/>
    <rect x="918" y="184" width="300" height="216" rx="18" fill="none" stroke="#34d399" stroke-opacity=".38"/>
    <text x="942" y="220" fill="#a7f3d0" font-size="13">Human or host separately decides</text>
    <text x="942" y="242" fill="#a7f3d0" font-size="13">permission, execution, and handoff.</text>
    <rect x="942" y="270" width="118" height="92" rx="16" fill="#064e3b" fill-opacity=".78" stroke="#22c55e" stroke-width="2"/>
    <text x="1001" y="310" fill="#f0fdf4" font-size="17" font-weight="700" text-anchor="middle">Human Gate</text>
    <text x="1001" y="336" fill="#a7f3d0" font-size="12" text-anchor="middle">permission</text>
    <rect x="1074" y="270" width="120" height="92" rx="16" fill="#064e3b" fill-opacity=".78" stroke="#34d399" stroke-width="2"/>
    <text x="1134" y="304" fill="#f0fdf4" font-size="16" font-weight="700" text-anchor="middle">Safe</text>
    <text x="1134" y="326" fill="#f0fdf4" font-size="16" font-weight="700" text-anchor="middle">Handoff</text>
    <text x="1134" y="348" fill="#a7f3d0" font-size="12" text-anchor="middle">downstream</text>

    <rect x="900" y="454" width="336" height="172" rx="24" fill="#0f172a" stroke="#6366f1" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="926" y="490" fill="#c7d2fe" font-size="18" font-weight="750">Optional adapter</text>
    <text x="926" y="520" fill="#94a3b8" font-size="14">Maps supported lifecycle events</text>
    <text x="926" y="543" fill="#e0e7ff" font-size="14" font-weight="700">to Intent Lock only.</text>
    <text x="926" y="574" fill="#94a3b8" font-size="13">May retain privacy-minimized</text>
    <text x="926" y="596" fill="#94a3b8" font-size="13">local session state.</text>
    <path d="M830 554H884V540H900" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="7 7"/>

    <text x="640" y="704" fill="#94a3b8" font-size="14" text-anchor="middle">No execution · no automatic routing · core primitives do not compose implicitly</text>
  </g>
</svg>
