[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-frontdoor-hooks"
version = "0.2.0"
description = "Optional cross-agent runtime adapters for Agent Frontdoor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["agent-frontdoor>=0.2.0,<0.3"]

[project.scripts]
agent-frontdoor-hook = "frontdoor_hooks.hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agent-frontdoor-hooks/examples" = [
  "examples/codex-hooks.json",
  "examples/claude-settings.json",
]
