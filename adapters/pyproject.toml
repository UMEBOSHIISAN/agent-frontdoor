[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-frontdoor-hooks"
version = "0.1.0"
description = "Optional cross-agent runtime adapters for Agent Frontdoor"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["agent-frontdoor>=0.1.0,<0.2"]

[project.scripts]
agent-frontdoor-hook = "frontdoor_hooks.hook:main"

[tool.setuptools.packages.find]
where = ["src"]

