[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-frontdoor"
version = "0.1.0"
description = "Fail-closed preflight validation for bounded AI task cards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.scripts]
agent-frontdoor = "frontdoor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
