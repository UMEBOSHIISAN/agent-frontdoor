[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-frontdoor-hooks"
version = "0.2.0"
description = "Optional local Codex and Claude Code hooks for Agent Frontdoor Intent Lock"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["agent-frontdoor>=0.2.0,<0.3"]
keywords = ["ai-agents", "claude-code", "codex", "intent-lock"]

[project.scripts]
agent-frontdoor-hook = "frontdoor_hooks.hook:main"

[project.urls]
Homepage = "https://github.com/UMEBOSHIISAN/agent-frontdoor"
Documentation = "https://github.com/UMEBOSHIISAN/agent-frontdoor/tree/main/adapters"
Source = "https://github.com/UMEBOSHIISAN/agent-frontdoor"
Issues = "https://github.com/UMEBOSHIISAN/agent-frontdoor/issues"
Changelog = "https://github.com/UMEBOSHIISAN/agent-frontdoor/blob/main/CHANGELOG.md"
Security = "https://github.com/UMEBOSHIISAN/agent-frontdoor/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agent-frontdoor-hooks/examples" = [
  "examples/codex-hooks.json",
  "examples/claude-settings.json",
]
