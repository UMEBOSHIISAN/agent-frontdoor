<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Agent Frontdoor</title>
  <desc id="hero-desc">A bounded indigo task path passes through read-only evaluation planes and a green human review boundary before a contained handoff.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hero-path" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6366f1"/>
      <stop offset=".72" stop-color="#818cf8"/>
      <stop offset=".73" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="hero-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#334155" stroke-opacity=".22"/>
      <circle cx="0" cy="0" r="2" fill="#475569" fill-opacity=".28"/>
    </pattern>
    <marker id="hero-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#hero-bg)"/>
  <rect width="1280" height="640" fill="url(#hero-grid)"/>
  <circle cx="1060" cy="315" r="280" fill="#312e81" fill-opacity=".09"/>
  <circle cx="1060" cy="315" r="206" fill="#22c55e" fill-opacity=".035"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="76" y="114" fill="#818cf8" font-size="17" font-weight="700" letter-spacing="3">READ-ONLY PREFLIGHT</text>
    <text x="72" y="214" fill="#f8fafc" font-size="72" font-weight="760" letter-spacing="-2">Agent Frontdoor</text>
    <text x="76" y="263" fill="#cbd5e1" font-size="24">Bound the task. Keep authority with the human.</text>

    <g transform="translate(76 314)">
      <rect width="166" height="38" rx="19" fill="#312e81" fill-opacity=".42" stroke="#6366f1" stroke-opacity=".72"/>
      <text x="83" y="25" fill="#e0e7ff" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">TASK IDENTITY</text>
    </g>
    <g transform="translate(254 314)">
      <rect width="174" height="38" rx="19" fill="#312e81" fill-opacity=".42" stroke="#6366f1" stroke-opacity=".72"/>
      <text x="87" y="25" fill="#e0e7ff" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">DRIFT CHECK</text>
    </g>
    <g transform="translate(440 314)">
      <rect width="168" height="38" rx="19" fill="#064e3b" fill-opacity=".28" stroke="#22c55e" stroke-opacity=".72"/>
      <text x="84" y="25" fill="#d1fae5" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">HUMAN GATE</text>
    </g>

    <text x="76" y="542" fill="#94a3b8" font-size="16" letter-spacing=".4">One bounded path · deterministic decisions · external authority</text>
  </g>

  <g>
    <path d="M672 394H1198" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round"/>
    <path d="M672 394H1198" fill="none" stroke="url(#hero-path)" stroke-width="8" stroke-linecap="round" marker-end="url(#hero-arrow)"/>
    <circle cx="672" cy="394" r="15" fill="#0b1020" stroke="#6366f1" stroke-width="6"/>

    <rect x="760" y="174" width="304" height="350" rx="26" fill="#0f172a" fill-opacity=".32" stroke="#334155" stroke-width="3"/>
    <rect x="800" y="208" width="264" height="282" rx="22" fill="#0f172a" fill-opacity=".28" stroke="#3730a3" stroke-opacity=".52" stroke-width="3"/>
    <rect x="840" y="242" width="224" height="214" rx="18" fill="#111827" fill-opacity=".5" stroke="#6366f1" stroke-opacity=".64" stroke-width="3"/>
    <rect x="880" y="276" width="184" height="146" rx="15" fill="#111827" fill-opacity=".68" stroke="#818cf8" stroke-opacity=".72" stroke-width="3"/>

    <circle cx="806" cy="394" r="8" fill="#818cf8"/>
    <circle cx="860" cy="394" r="8" fill="#818cf8"/>
    <circle cx="914" cy="394" r="8" fill="#818cf8"/>
    <circle cx="968" cy="394" r="8" fill="#818cf8"/>

    <rect x="1027" y="194" width="74" height="400" rx="28" fill="#052e2b" fill-opacity=".86" stroke="#22c55e" stroke-width="4"/>
    <path d="M1046 236V552M1082 236V552" stroke="#34d399" stroke-opacity=".54" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1064" cy="394" r="12" fill="#d1fae5" stroke="#22c55e" stroke-width="6"/>
    <circle cx="1198" cy="394" r="15" fill="#0b1020" stroke="#34d399" stroke-width="5"/>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1.4">
      <text x="912" y="146" fill="#94a3b8" font-size="13" text-anchor="middle">READ-ONLY CORE</text>
      <text x="1064" y="620" fill="#86efac" font-size="13" text-anchor="middle">HUMAN REVIEW</text>
      <text x="1198" y="358" fill="#a7f3d0" font-size="12" text-anchor="end">SAFE HANDOFF</text>
      <text x="672" y="358" fill="#a5b4fc" font-size="12">BOUNDED INPUT</text>
    </g>
  </g>
</svg>
