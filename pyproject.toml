[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-frontdoor"
version = "0.1.0"
description = "Fail-closed preflight validation for bounded AI task cards"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
agent-frontdoor = "frontdoor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frontdoor = ["schema/*.json"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
