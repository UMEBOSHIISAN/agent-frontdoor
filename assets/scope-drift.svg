<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Two individually valid task cards, compared: a read-only audit has quietly become mutation work, and check-drift exits non-zero">
  <defs>
    <linearGradient id="sdbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#101d40"/>
    </linearGradient>
    <marker id="sda" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90d9"/>
    </marker>
    <marker id="sdr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06a6a"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="url(#sdbg)"/>
  <g fill="#ffffff" opacity="0.4">
    <circle cx="120" cy="60" r="1.1"/><circle cx="1100" cy="78" r="1"/><circle cx="600" cy="26" r="1"/>
    <circle cx="1155" cy="614" r="1.1"/><circle cx="46" cy="586" r="1"/>
  </g>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="600" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#e8eef7">Both cards are valid. That is exactly the problem.</text>
    <text x="600" y="71" text-anchor="middle" font-size="13.5" fill="#8fa4c8">「読むだけの監査」が「直す作業」に育つのは攻撃ではなく、最も自然なスコープの伸び方。1枚ずつ検証しても捕まらない。</text>

    <!-- BEFORE -->
    <rect x="44" y="96" width="524" height="330" rx="12" fill="#0d1733" stroke="#2f7d7d"/>
    <text x="70" y="126" font-size="15" font-weight="700" fill="#9de8e8">BEFORE · the card a human read</text>
    <text x="70" y="146" font-size="11.5" fill="#6fb5b5">reviewed on Monday · approved as written</text>
    <line x1="70" y1="158" x2="542" y2="158" stroke="#2c4a86"/>

    <text x="70" y="182" font-size="11.5" fill="#8fa4c8">task_class</text>
    <text x="212" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#9de8e8">AUDIT</text>

    <text x="70" y="212" font-size="11.5" fill="#8fa4c8">allowed_actions</text>
    <text x="212" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">read the configuration files</text>
    <text x="212" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">report what is inconsistent</text>

    <text x="70" y="262" font-size="11.5" fill="#8fa4c8">forbidden_actions</text>
    <text x="212" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">modify any file</text>
    <text x="212" y="282" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">install or upgrade anything</text>

    <text x="70" y="312" font-size="11.5" fill="#8fa4c8">human_gate</text>
    <text x="212" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">CONFIRM</text>

    <text x="70" y="342" font-size="11.5" fill="#8fa4c8">next_safe_step</text>
    <text x="212" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">list the inconsistencies found</text>

    <rect x="70" y="364" width="472" height="40" rx="8" fill="#0f2f33" stroke="#2f7d7d"/>
    <text x="306" y="390" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#9de8e8">agent-frontdoor validate → VALID · exit 0</text>

    <!-- AFTER -->
    <rect x="632" y="96" width="524" height="330" rx="12" fill="#0d1733" stroke="#7d2f3a"/>
    <text x="658" y="126" font-size="15" font-weight="700" fill="#ffb3b3">AFTER · the card that reaches the worker</text>
    <text x="658" y="146" font-size="11.5" fill="#c98d94">rewritten on Tuesday · nobody reviewed it again</text>
    <line x1="658" y1="158" x2="1130" y2="158" stroke="#2c4a86"/>

    <text x="658" y="182" font-size="11.5" fill="#8fa4c8">task_class</text>
    <rect x="794" y="167" width="120" height="21" rx="4" fill="#3a1620"/>
    <text x="800" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#ffb3b3">REMEDIATION</text>

    <text x="658" y="212" font-size="11.5" fill="#8fa4c8">allowed_actions</text>
    <text x="800" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">read the configuration files</text>
    <text x="800" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">report what is inconsistent</text>
    <rect x="794" y="238" width="248" height="21" rx="4" fill="#3a1620"/>
    <text x="800" y="253" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#ffb3b3">apply the obvious fixes</text>

    <text x="658" y="281" font-size="11.5" fill="#8fa4c8">forbidden_actions</text>
    <text x="800" y="281" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6b7a99">modify any file</text>
    <line x1="798" y1="277" x2="906" y2="277" stroke="#e06a6a" stroke-width="1.5"/>
    <text x="918" y="281" font-size="10.5" fill="#c98d94">← quietly dropped</text>
    <text x="800" y="301" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">install or upgrade anything</text>

    <text x="658" y="325" font-size="11.5" fill="#8fa4c8">human_gate</text>
    <text x="800" y="325" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">CONFIRM</text>
    <text x="892" y="325" font-size="10.5" fill="#c98d94">← unchanged. The gate did not notice.</text>

    <text x="658" y="349" font-size="11.5" fill="#8fa4c8">next_safe_step</text>
    <text x="800" y="349" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#cdd9ee">apply and report</text>

    <rect x="658" y="364" width="472" height="40" rx="8" fill="#0f2f33" stroke="#2f7d7d"/>
    <text x="894" y="390" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#9de8e8">agent-frontdoor validate → VALID · exit 0</text>

    <!-- comparison -->
    <line x1="306" y1="432" x2="306" y2="470" stroke="#4a90d9" stroke-width="2" marker-end="url(#sda)"/>
    <line x1="894" y1="432" x2="894" y2="470" stroke="#4a90d9" stroke-width="2" marker-end="url(#sda)"/>

    <rect x="230" y="476" width="740" height="72" rx="10" fill="#132449" stroke="#4a90d9"/>
    <text x="600" y="504" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#e8eef7">agent-frontdoor check-drift before.json after.json</text>
    <text x="600" y="530" text-anchor="middle" font-size="12" fill="#8fa4c8">validates both cards first, then compares their boundaries — the drift lives between them, not inside either one</text>

    <line x1="600" y1="554" x2="600" y2="576" stroke="#e06a6a" stroke-width="2" marker-end="url(#sdr)"/>

    <rect x="230" y="582" width="740" height="60" rx="10" fill="#2a1218" stroke="#7d2f3a"/>
    <text x="600" y="608" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#ffb3b3">DRIFT · audit_to_mutation · exit 3</text>
    <text x="600" y="630" text-anchor="middle" font-size="11.5" fill="#c98d94">Read-only audit scope expanded to mutation work. Nothing was executed, repaired, or forwarded. 何も実行せず、直さず、次へ渡さない。</text>
  </g>
</svg>
